spring.application.name=wellness-backend

# In-memory H2 database - resets on every restart. Fine for a dissertation
# prototype; swap for Postgres/MySQL if this is carried into a real build.
spring.datasource.url=jdbc:h2:mem:wellnessdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# H2 console at http://localhost:8080/h2-console (jdbc url above) - useful for
# demoing the persisted data during your viva/demo.
spring.h2.console.enabled=true

server.port=8080
